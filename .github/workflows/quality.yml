name: Quality

# Runs the same 12-phase pipeline the owner runs locally (`npm run verify`),
# on EVERY branch — the guardrails must not depend on remembering to run them.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Full verification pipeline
        run: npm run verify

      - name: Upload generated site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: .output/public
          retention-days: 7

  # The Playwright suite is the only coverage for hydration, responsive
  # breakpoints, and the chat client contract — it must not depend on being
  # run locally. Laptop project only: the device matrix stays an on-demand
  # local tool (npm run test:e2e:devices).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: End-to-end tests (prerendered build)
        run: npm run test:e2e -- --project=laptop

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

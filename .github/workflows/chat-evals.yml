name: Chat evals

# The unit tests prove the chat function's plumbing offline. They cannot prove
# the assistant still REFUSES what it is supposed to refuse — that behaviour
# lives in the system prompt and only shows up in real calls.
#
# This workflow replays tests/chat/evals/cases.jsonl (scope, pretext/injection,
# invented-fact, hedge-preservation, grounding, navigation) against the model
# with the prompt built from the commit under test, and grades each answer with
# a judge model. A prompt or content edit that quietly breaks the scope guard
# fails here instead of on the live site.
#
# Needs one repository secret:
#   ANTHROPIC_API_KEY   — use a key dedicated to CI, not the production one
#
# Without it there is nothing to run the evals with. The preflight job exists
# for the same reason as the one in deploy.yml: guarding every step of a single
# job with `if: key-is-present` makes that job report SUCCESS while running
# nothing, so a commit gets a green "Chat evals" check that graded no answers.
# A job-level `if` cannot read the `secrets` context, so preflight turns secret
# presence into a job output and the evals job keys off it — with no key the run
# shows "evals — skipped" in grey, which is the truth.
#
# Each run costs a few cents at Haiku pricing.
on:
  push:
    branches: [main]
    paths:
      - 'shared/chat/**'
      - 'api/chat.ts'
      - 'content/**'
      - 'tests/chat/evals/**'
      - 'scripts/eval-chat.ts'
      - '.github/workflows/chat-evals.yml'
  pull_request:
    paths:
      - 'shared/chat/**'
      - 'api/chat.ts'
      - 'content/**'
      - 'tests/chat/evals/**'
      - 'scripts/eval-chat.ts'
  schedule:
    # Weekly drift check — model updates can change refusal behaviour even
    # when neither the prompt nor the content moved.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.creds.outputs.ready }}
    steps:
      - name: Check for an API key
        id: creds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "API key present — evals will run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NO EVALS RAN — ANTHROPIC_API_KEY is not set. The assistant's scope guard and grounding are UNVERIFIED for this commit. Add the secret (use a key dedicated to CI) to switch the evals on."
            {
              echo "## ⚠️ No evals ran"
              echo
              echo "\`ANTHROPIC_API_KEY\` is not set, so the assistant's refusal"
              echo "behaviour and grounding are **unverified** for this commit."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  evals:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run chat evals
        run: npm run eval:chat -- --json=eval-report.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chat-eval-report
          path: eval-report.json
          retention-days: 30
